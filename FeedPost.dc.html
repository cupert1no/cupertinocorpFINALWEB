<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-family:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;}button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit;}</style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-family:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;}button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit;}</style>
<style>
  *{box-sizing:border-box;}
</style>
</helmet>

<div style="font-family:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;border-radius:16px;overflow:hidden;background:rgba(20,20,24,.5);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 14px 44px rgba(0,0,0,.22);border:none;">

  <!-- fecha y hora -->
  <div style="padding:15px 16px 13px;">
    <span style="font:500 11px -apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;opacity:.62;">{{ data.stamp }}</span>
  </div>

  <!-- text body -->
  <sc-if value="{{ data.isText }}" hint-placeholder-val="{{ true }}">
    <div style="padding:2px 16px 17px;font:400 17px/1.65 -apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:0em;color:rgba(255,255,255,.9);text-wrap:pretty;">{{ data.caption }}</div>
  </sc-if>

  <!-- media -->
  <sc-if value="{{ data.hasMedia }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;overflow:hidden;background:#0e0e11;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);">
      <sc-if value="{{ data.isImage }}" hint-placeholder-val="{{ true }}">
        <img src="{{ data.image }}" alt="" loading="lazy" style="display:block;width:100%;aspect-ratio:{{ data.aspect }};object-fit:cover;background:#141417;">
      </sc-if>
      <sc-if value="{{ data.isVideo }}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{ data.playing }}" hint-placeholder-val="{{ false }}">
          <video src="{{ data.videoSrc }}" autoplay="{{ true }}" playsinline="{{ true }}" onClick="{{ data.onToggle }}" style="display:block;width:100%;aspect-ratio:{{ data.aspect }};object-fit:cover;background:#000;cursor:pointer;"></video>
          <button onClick="{{ data.onPause }}" aria-label="Pausar vídeo" style="position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(15,15,19,.55);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);color:#fff;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:2;border:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:block;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg></button>
        </sc-if>
        <sc-if value="{{ data.notPlaying }}" hint-placeholder-val="{{ true }}">
          <img src="{{ data.poster }}" alt="" loading="lazy" style="display:block;width:100%;aspect-ratio:{{ data.aspect }};object-fit:cover;background:#141417;">
          <button onClick="{{ data.onPlay }}" aria-label="Reproducir vídeo" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:rgba(15,15,19,.5);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);color:#fff;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.55);border:none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:block;margin-left:2px;"><path d="M8 5v14l11-7z"></path></svg></button>
          <span style="position:absolute;left:12px;bottom:12px;font:500 11px -apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;padding:5px 9px;border-radius:7px;background:rgba(15,15,19,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:none;">VÍDEO · TOCA PARA REPRODUCIR</span>
        </sc-if>
      </sc-if>
    </div>
  </sc-if>

  <!-- caption (image / video) -->
  <sc-if value="{{ data.hasCaption }}" hint-placeholder-val="{{ true }}">
    <div style="padding:14px 16px 4px;font:400 14px/1.62 -apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;color:rgba(255,255,255,.74);text-wrap:pretty;">{{ data.caption }}</div>
  </sc-if>

  <!-- location -->
  <sc-if value="{{ data.hasLocation }}" hint-placeholder-val="{{ false }}">
    <div style="padding:8px 16px 16px;font:400 11px -apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.4;">◦ {{ data.location }}</div>
  </sc-if>

  <!-- breathing room where there is no location line -->
  <sc-if value="{{ data.padBottom }}" hint-placeholder-val="{{ true }}">
    <div style="height:16px;"></div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 480, &quot;height&quot;: 420 }, &quot;data&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot; } }"></script>
</body>
</html>

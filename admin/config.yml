backend:
  name: github
  repo: cupert1no/cupertinocorpFINALWEB
  branch: main
  # URL del Worker de OAuth (Cloudflare).
  base_url: https://cupertino-cms-auth.jderojas15.workers.dev

# Carpeta donde se suben las imágenes nuevas
media_folder: assets/img
public_folder: /assets/img

collections:
  # ============ HOME (sección NOW) ============
  - name: home
    label: Home
    icon: home
    files:
      - name: now
        label: Sección NOW
        file: content/home.json
        description: "El bloque «NOW» de la página de inicio (escuchando, leyendo, viendo, trabajando)."
        fields:
          - name: now
            label: NOW
            widget: object
            fields:
              - { name: escuchando, label: Escuchando, widget: string }
              - { name: leyendo, label: Leyendo, widget: string }
              - { name: viendo, label: Viendo, widget: string }
              - { name: trabajando, label: Trabajando, widget: string }
              - { name: actualizado, label: "Actualizado (etiqueta)", widget: string, hint: "p.ej. JUNIO 2026 — se muestra tras «ACTUALIZADO · »" }

